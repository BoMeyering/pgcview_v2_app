name: Release

# Manual, on purpose: releases happen when you decide to cut one, not on
# every push to main. Pick the bump type and run it from the Actions tab
# (or `gh workflow run release.yml -f bump=minor`).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increment"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write   # create the tag + GitHub Release
  packages: write   # push the image to GHCR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed to find the latest version

      - name: Compute next version
        id: version
        run: |
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          latest_tag="${latest_tag:-v0.0.0}"

          IFS='.' read -r major minor patch <<< "${latest_tag#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_tag="v${major}.${minor}.${patch}"

          echo "previous_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase image path; github.repository preserves
          # this repo's actual (mixed-case) name, so lowercase it here once.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.new_tag }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write release notes
        id: notes
        run: |
          {
            echo "## Docker image"
            echo '```'
            echo "docker pull ${{ steps.version.outputs.image }}:${{ steps.version.outputs.new_tag }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "## Changes since ${{ steps.version.outputs.previous_tag }}"
            git log "${{ steps.version.outputs.previous_tag }}..HEAD" --pretty=format:"- %s (%h)" 2>/dev/null \
              || echo "- Initial release"
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.new_tag }}" \
            --title "${{ steps.version.outputs.new_tag }}" \
            --notes-file release_notes.md
