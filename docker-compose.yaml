# Stands up PGCView + Postgres 16.
#
# Build the image first (tags both a version and `latest`):
#   ./build_container.sh
#
# Then bring everything up (copy .env.docker.example to .env.docker and fill
# it in first — see that file for why it's .env.docker and not plain .env):
#   docker compose --env-file .env.docker up -d
#
# All app config is passed in as environment variables below, resolved from
# ${VAR} references against .env.docker. Anything without a default here is
# required.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pgcview}"
      POSTGRES_USER: "${POSTGRES_USER:-pgcview}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgcview} -d ${POSTGRES_DB:-pgcview}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: "${IMAGE_NAME:-pgcview_app}:${IMAGE_TAG:-latest}"
    # Runs tini as real PID 1 so both gunicorn's and supercronic's child
    # processes get reaped properly, and signals still forward correctly.
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    environment:
      # ── Django core ──────────────────────────────────────────────────────
      DJANGO_SETTINGS_MODULE: "pgcview.settings.prod"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      DEBUG: "${DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set, e.g. pgcview.example.com}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set, e.g. https://pgcview.example.com}"

      # ── Database — built from the same Postgres credentials as the db
      #    service above, so there's one source of truth for them. ──────────
      DATABASE_URL: "postgres://${POSTGRES_USER:-pgcview}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pgcview}"

      # ── Google OAuth / Drive Picker ──────────────────────────────────────
      GOOGLE_OAUTH2_CLIENT_ID: "${GOOGLE_OAUTH2_CLIENT_ID:?GOOGLE_OAUTH2_CLIENT_ID must be set}"
      GOOGLE_OAUTH2_CLIENT_SECRET: "${GOOGLE_OAUTH2_CLIENT_SECRET:?GOOGLE_OAUTH2_CLIENT_SECRET must be set}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?GOOGLE_API_KEY must be set}"

      # ── RunPod inference API ─────────────────────────────────────────────
      RUNPOD_BASE_URL: "${RUNPOD_BASE_URL:-https://mm45wxdx8ku3z1.api.runpod.ai}"
      RUNPOD_API_KEY: "${RUNPOD_API_KEY:?RUNPOD_API_KEY must be set}"

      # ── Optional: auto-create a superuser on first boot (see
      #    ensure_superuser management command). Leave unset to skip. ───────
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"

      # ── gunicorn tuning — gthread workers (set in docker/entrypoint.sh) so
      #    a slow-but-legitimate SSE response (image processing, Drive
      #    upload progress) isn't killed by --timeout; size WORKERS/THREADS
      #    for how many jobs can realistically run at once. ────────────────
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
