{% extends "auth_base.html" %}

{% block title %}Sign Out — PGCView{% endblock %}

{% block card_content %}
<div class="text-center">
  <h2 class="text-xl font-semibold text-gray-900 mb-2">Sign out?</h2>
  <p class="text-sm text-gray-500 mb-6">You will be returned to the login page.</p>
  <form method="POST" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit"
            class="w-full rounded-xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-brand-700 transition focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
      Yes, sign me out
    </button>
  </form>
  <a href="{% url 'jobs:dashboard' %}"
     class="mt-3 block text-sm text-gray-500 hover:text-gray-700 transition">
    Cancel — go back to dashboard
  </a>
</div>
{% endblock %}
