{% load i18n %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign-In Error — PGCView</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>html { font-size: 18px; }</style>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 600: '#16a34a', 700: '#15803d' } } } } }</script>
</head>
<body class="h-full antialiased font-sans">
<div class="flex min-h-full flex-col items-center justify-center py-12 px-6">

  <a href="/" class="mb-8 flex items-center gap-2.5">
    <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-brand-600">
      <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159" />
      </svg>
    </div>
    <span class="text-lg font-bold text-gray-900">PGCView</span>
  </a>

  <div class="w-full max-w-sm rounded-2xl bg-white border border-gray-100 shadow-sm p-8 text-center">
    <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-100">
      <svg class="h-7 w-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
    </div>
    <h2 class="text-xl font-bold text-gray-900 mb-2">Sign-in failed</h2>
    <p class="text-sm text-gray-500 mb-6">
      An error occurred while signing in with your Google account. Please try again.
    </p>
    <a href="{% url 'account_login' %}"
       class="inline-flex items-center gap-2 rounded-xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 transition">
      Try again
    </a>
  </div>
</div>
</body>
</html>
